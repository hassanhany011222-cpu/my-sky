<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>To Samira ✨</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         شاشة البداية
    ========================== -->

    <main id="app">

        <section id="intro" class="screen active">

            <div class="intro-content">

                <p class="intro-line">
                    بصي للسماء كويس... ✨
                </p>

                <p class="intro-line second">
                    يمكن تلاقي فيها حاجات كتير...
                </p>

                <p class="intro-line third">
                    بس أنا لقيت فيها حاجة واحدة بس.
                </p>

                <button id="startBtn">
                    ابدئي ✨
                </button>

            </div>

        </section>


        <!-- =========================
             باقي المراحل
             سنضيفها في الأجزاء القادمة
        ========================== -->

        <section id="photoOne" class="screen">
            <!-- الصورة الأولى -->
        </section>

        <section id="starsStage" class="screen">
            <!-- مرحلة النجوم -->
        </section>

        <section id="photoTwo" class="screen">
            <!-- الصورة الثانية -->
        </section>

        <section id="finalStar" class="screen">
            <!-- النجمة الأخيرة -->
        </section>

        <section id="samiraStage" class="screen">
            <!-- تكوين SAMIRA -->
        </section>

        <section id="finalStage" class="screen">
            <!-- الصورة الرئيسية + الرسالة -->
        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
